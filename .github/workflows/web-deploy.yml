# =============================================================================
# Web · Deploy — thin caller of the shared reusable (ci).
#
# 1-env static site: merge to main -> build + publish to Cloudflare Pages via
# the shared workflow (build runs in CI, not Cloudflare's builder). No release
# tag needed. No approval gate (public marketing site).
#
# PREREQUISITE: disable Cloudflare's GitHub auto-build for this Pages project so
# CI is the single source of deploys (no double-deploy). Cloudflare creds come
# from ORG secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID; the Pages
# project name from the PAGES_PROJECT var (+ optional APP_URL for the
# post-deploy health check).
# =============================================================================
name: Web · Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Must match the UNION of every inner job's own permissions in the reusable
    # web-deploy.yml, not just default (GitHub validates the whole chain at
    # startup) -- packages:read is for the build job's pnpm install of private
    # @quynhonsemiconductor/* packages.
    permissions:
      contents: read
      packages: read
    uses: quynhonsemiconductor/ci/.github/workflows/web-deploy.yml@de56bff40c5468623aa9e69d1ebe8e638e874bdf # v1.24.2
    with:
      product: qnsc-landing
      build_command: pnpm build
      web_dist_path: dist
      single_environment: production
      pnpm_version: '10.34.7'
    # Least-privilege: pass only what the reusable declares (no `secrets: inherit`).
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # An account id is an identifier, not a secret: the org publishes it as a VARIABLE
      # (org vars CLOUDFLARE_ACCOUNT_ID), and secrets.CLOUDFLARE_ACCOUNT_ID does not exist —
      # it resolved to empty, breaking every deploy.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

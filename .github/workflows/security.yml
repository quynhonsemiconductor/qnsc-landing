# =============================================================================
# Security — thin caller of the shared reusable suite (ci).
#
# qnsc-landing is Cloudflare-native (Astro static + one Pages Function, no
# Dockerfile), so it calls the shared workflow with `scan_container: false`:
# the Trivy container-CVE job is skipped while Semgrep (SAST, replaces CodeQL),
# Gitleaks (secrets, MIT CLI) and osv-scanner (dependency CVEs, replaces
# dependency-review) still run source-based. This gives the same security gate
# as the rova/opshub products, so posture is uniform across the org.
#
# actions-security (zizmor) replaces Code Scanning Default Setup's
# `Analyze (actions)`. Blocking, after triaging the initial findings (see the
# job's own comments for the artipacked/excessive-permissions fixes applied).
# =============================================================================
name: Security · Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # weekly Monday 04:00 UTC — catch new CVEs between pushes

permissions:
  contents: read
  # Ceiling for the reusable's SARIF-upload job, which declares security-events:write
  # itself -- a called workflow's job permissions can only be REDUCED, not elevated,
  # above this caller's top-level grant, and GitHub validates the whole chain at
  # startup -- so this must stay even though no step in THIS file uses it directly.
  security-events: write # zizmor: ignore[excessive-permissions] ceiling for reusable's SARIF job
  packages: read # ceiling for the reusable Trivy job's `packages: read`; a called
  # workflow's job permissions can only be REDUCED, not elevated, above the caller's
  # top-level grant. Trivy is skipped here (scan_container: false), but GitHub validates
  # every reusable job's permission ceiling at STARTUP before evaluating `if:`, so this
  # must be present or the whole run fails with startup_failure. (Confirmed root cause
  # of the recurring Security · Scan startup_failure.)

jobs:
  security:
    uses: quynhonsemiconductor/ci/.github/workflows/security.yml@v1
    with:
      product: qnsc-landing
      scan_container: false # no Dockerfile — skip Trivy, keep Semgrep + Gitleaks + osv
      node_version: '22'
      # ENFORCED, not report-only. The shared workflow defaults this to false, and
      # nothing here had set it — so osv-scanner reported thirteen findings while the
      # job concluded `success`, for weeks, including an unpatched CVSS 9.8 RCE in
      # astro's AVIF image optimisation (GHSA-26w7-cxv4-gfx2). A green check that means
      # "the scanner ran" rather than "the tree is clean" is worse than no check: it is
      # read as the second thing.
      #
      # Every finding it was hiding is cleared in the same change that sets this, so it
      # is turned on against a clean tree rather than left to be triaged later — which
      # is how it came to be false in the first place.
      osv_blocking: true
    # security.yml declares no secrets -- nothing to pass (no secrets: inherit).

  actions-security:
    permissions:
      contents: read
      security-events: write
    uses: quynhonsemiconductor/ci/.github/workflows/actions-security.yml@v1
    with:
      blocking: true

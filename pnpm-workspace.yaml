# pnpm workspace config. qnsc-landing is a single package, so there is no
# `packages:` list — this file exists for the two blocks below.

# Transitive CVE floors. Every entry here is a package this repo does NOT declare:
# it arrives under a dev tool, and the tool's own declared range already admits the
# fix, so the lockfile was simply resolved before the advisory published. A floor
# rather than an exact pin, except where a cross-major force would break a consumer.
#
# WHY THIS BLOCK EXISTS AT ALL. Until now this repo had no `overrides:` and its
# `security / Dependency CVE scan (osv-scanner)` ran REPORT-ONLY (the shared
# workflow's `osv_blocking` defaults to false and nothing set it), so thirteen
# findings — including an unpatched CVSS 9.8 — reported green for weeks. `osv_blocking`
# is set to true in the same change that clears them; a scanner nobody is required to
# read is not a control.
overrides:
  # GHSA-rgj7-g3m4-5g8c (CVSS 8.9) and GHSA-f88m-g3jw-g9cj (CVSS 7.0) — sharp inherits
  # libheif and libvips vulnerabilities through its bundled native binaries. Fixed in
  # 0.35.4 and 0.35.0 respectively.
  #
  # The DIRECT dependency is bumped in package.json (^0.35.3 -> ^0.35.4); this floor is
  # for the SECOND copy, which arrives under miniflare — wrangler's local dev runtime —
  # and so is dev-only. `>=` and not a pin: sharp ships prebuilt binaries per platform
  # and pinning one patch across every consumer is how a CI runner ends up without one.
  'sharp@<0.35.4': '>=0.35.4'
  # GHSA-4cwx-7wf7-3272 (CVSS 7.4, cross-user information disclosure and a parse-time
  # crash from degenerate private cache directives) plus three lower-severity siblings.
  # Fixed in 7.29.0 on the 7.x line.
  #
  # Dev-only: the sole path is miniflare. Bounded INSIDE the major, the way rova's
  # equivalent entry is — an unbounded floor drags a consumer onto 8.x, whose internals
  # differ, and this tree already resolves an independent undici 8.10.2 that is fine.
  'undici@>=7.0.0 <7.29.0': '>=7.29.0 <8.0.0'
  # GHSA-fxqj-rqcc-2cmp (CVSS 6.3) — incomplete fix of GHSA-6g55-p6wh-862q: an
  # attacker-controlled `sourceMappingURL` is still read. Fixed in 8.5.23.
  #
  # Dev-only, via eslint-plugin-astro. A second postcss (8.5.28) already resolves
  # correctly elsewhere in the tree, so this only lifts the stale copy.
  'postcss@<8.5.23': '>=8.5.23'
  # GHSA-2v37-7h3g-55p8 (CVSS 8.2) — a custom generator can loop indefinitely when
  # size is zero. Fixed in 3.3.18.
  #
  # Reached only through the postcss above, which calls it with a fixed non-zero size,
  # so the zero-size path is not reachable here. Listed anyway because the entry above
  # does not guarantee which nanoid the older postcss brings. NOT forced across majors:
  # postcss declares ^3.3.11 and nanoid 4.x+ is ESM-only.
  'nanoid@>=3.0.0 <3.3.18': '3.3.18'
  # GHSA-5jgf-p345-68v8 and its siblings (CVSS 7.5 each) — host confusion and SSRF in
  # the same URI parser: failed IDN canonicalisation, a backslash authority introducer,
  # malformed and repeated authority forms, percent-encoded schemes. Fixed in 3.1.6.
  #
  # Dev-only, via ajv. THE UPPER BOUND IS THE POINT: every consumer here declares ^3.x
  # and nothing asks for 4.x, so an unbounded floor would resolve the newest thing that
  # satisfies it and carry the tree into a major nobody declared — which is precisely
  # how rova's own fast-uri override once became the thing tripping its scanner.
  'fast-uri@<3.1.6': '>=3.1.6 <4.0.0'
  # GHSA-mh99-v99m-4gvg (fixed 5.0.8) and GHSA-rgw5-rvv9-x895 (CVSS 7.5, DoS via
  # unbounded intermediate arrays, fixed 5.0.9 — and it explicitly BYPASSES the earlier
  # mitigation, so 5.0.8 is not a safe floor, only a newer one).
  #
  # Dev-only, via minimatch. A leaf utility with no API surface to speak of, and the
  # advisory range spans every published major, so the whole tree moves to one copy.
  'brace-expansion': '5.0.9'

# pnpm 11 refuses to run a package's postinstall unless it is named here, and exits 1
# with ERR_PNPM_IGNORED_BUILDS if the decision is unmade — which blocks every script in
# the repo, not just the install. Both of these build native binaries.
allowBuilds:
  esbuild: true
  sharp: true

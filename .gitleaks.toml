# EXTENDS the default ruleset — it does not replace it.
#
# Without this block gitleaks 8 treats a discovered config as THE config, so a file
# that defines only an [allowlist] and no [[rules]] leaves the scanner with an EMPTY
# ruleset. It then finds nothing, exits 0, and the required `Secret scan (Gitleaks)`
# check goes green — a security control whose failure mode is silent success. That is
# what this file did from the day it was added until 2026-09-09; verified by probe, a
# real `ghp_` token was NOT detected while this block was absent, and IS with it.
#
# Never delete these two lines to "simplify" the config.
[extend]
useDefault = true

title = "qnsc-landing gitleaks config"

[allowlist]
description = "Known false-positives in placeholder/example values"

# .env.example ships a fake Lambda Function URL placeholder, never a real secret.
paths = [
  '''\.env\.example''',
]

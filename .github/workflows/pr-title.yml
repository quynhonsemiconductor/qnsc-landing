# =============================================================================
# PR title — Conventional Commits, in its own workflow.
#
# WHY IT MOVED OUT OF ci.yml, and here the bug was the OPPOSITE of ceo-suite's.
# ci.yml does not listen for the `edited` pull_request event at all, so a
# corrected PR title never re-ran the check: it stayed red until somebody
# pushed an unrelated commit, which is the one thing a title fix should not
# require. Adding `edited` to ci.yml would have fixed that and introduced
# ceo-suite's problem instead — a title edit cancelling an in-flight build,
# since ci.yml sets cancel-in-progress. Its own workflow is what lets the
# check re-run on an edit without touching anything else.
#
# WHY THE ACTION, NOT ci's REUSABLE WORKFLOW: a job that calls a reusable
# workflow reports its check as `<caller job>/<called job>`, which would rename
# this check. A required check that never reports does not fail — it blocks
# every merge.
# =============================================================================
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  # Deliberately NOT the ci group. Sharing one is what let a title edit cancel
  # a build.
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # required by the action's underlying semantic-pull-request step

jobs:
  pr-title:
    # This name IS the check context. Do not rename it.
    name: PR title (conventional commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: the action reads the title from the event payload.
      - uses: quynhonsemiconductor/ci/actions/pr-title-conventional-commits@v1
